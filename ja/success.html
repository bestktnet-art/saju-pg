<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お支払い完了 - 復縁の流れを読み解く</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif; background: #f3f1f5; margin: 0; padding: 24px; color: #222; }
  .card { max-width: 460px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  h1 { margin: 0 0 12px; font-size: 20px; color: #2b1e38; }
  p { margin: 0 0 20px; font-size: 14px; color: #555; line-height: 1.7; }
  .info-box { background: #faf8fc; border: 1px solid #e6dff0; border-radius: 10px; padding: 14px; font-size: 13px; color: #333; margin-bottom: 20px; text-align: left; line-height: 1.7; }
  .btn { display: inline-block; width: 100%; padding: 14px; background: #5b2c83; color: #fff; text-decoration: none; border-radius: 10px; font-size: 15px; font-weight: bold; border: none; cursor: pointer; }
  .btn:hover { background: #471f69; }
  .warn { color: #c92a42; font-weight: bold; }
</style>
</head>
<body>
<div class="card" id="statusCard">
  <h1 id="statusTitle">お支払い情報を確認しています...</h1>
  <p id="statusDesc">しばらくお待ちください。</p>
  <div class="info-box" id="orderDetailBox" style="display:none;"></div>
  <button type="button" class="btn" id="goResultBtn" style="display:none;">詳細鑑定画面へ進む</button>
</div>

<script>
(function () {
  const EXPECTED_AMOUNT = 2000;
  const STORAGE_REPORT_KEY = "saju_jp_report_data";
  const STORAGE_PAYMENT_KEY = "saju_jp_verified_payment";
  const STORAGE_PENDING_KEY = "saju_jp_pending_order";

  function readJson(key) {
    try {
      const s = sessionStorage.getItem(key);
      if (s) return JSON.parse(s);
    } catch (e) {}
    try {
      const l = localStorage.getItem(key);
      if (l) return JSON.parse(l);
    } catch (e) {}
    return null;
  }

  function writeJson(key, obj) {
    const raw = JSON.stringify(obj);
    try { sessionStorage.setItem(key, raw); } catch (e) {}
    try { localStorage.setItem(key, raw); } catch (e) {}
  }

  window.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("orderId") || "";
    const paymentKey = params.get("paymentKey") || "";
    const rawAmount = params.get("amount");
    const parsedAmount = rawAmount !== null && rawAmount !== "" ? Number(rawAmount) : EXPECTED_AMOUNT;

    const pendingOrder = readJson(STORAGE_PENDING_KEY) || readJson("saju_pending_order");
    const savedReport = readJson(STORAGE_REPORT_KEY) || readJson("saju_report_data");

    const titleEl = document.getElementById("statusTitle");
    const descEl = document.getElementById("statusDesc");
    const boxEl = document.getElementById("orderDetailBox");
    const goBtn = document.getElementById("goResultBtn");

    if (parsedAmount !== EXPECTED_AMOUNT) {
      titleEl.innerHTML = '<span class="warn">決済金額をご確認ください</span>';
      descEl.innerText = "決済金額（" + parsedAmount.toLocaleString() + "円）が設定金額（2,000円）と一致しません。元の画面へ戻って再度ご確認ください。";
      goBtn.style.display = "inline-block";
      goBtn.addEventListener("click", function () {
        window.location.href = "./index.html";
      });
      return;
    }

    const verifiedPayload = {
      ok: true,
      amount: EXPECTED_AMOUNT,
      orderId: orderId || (pendingOrder && pendingOrder.orderId) || ("JP_" + Date.now()),
      paymentKey: paymentKey || "TEST_KEY",
      verifiedAt: Date.now()
    };

    writeJson(STORAGE_PAYMENT_KEY, verifiedPayload);
    if (savedReport) {
      writeJson(STORAGE_REPORT_KEY, savedReport);
    }

    titleEl.innerText = "お支払いが完了しました";
    descEl.innerText = "詳しい復縁鑑定レポートをご確認いただけます。下のボタンを押して結果画面へお進みください。";
    boxEl.style.display = "block";
    boxEl.innerHTML =
      "<strong>お申し込み者:</strong> " + ((savedReport && savedReport.name) || (pendingOrder && pendingOrder.buyerName) || "ご相談者様") + "<br>" +
      "<strong>決済金額:</strong> 2,000円（税込）<br>" +
      "<strong>注文番号:</strong> " + verifiedPayload.orderId;

    goBtn.style.display = "inline-block";
    goBtn.addEventListener("click", function () {
      window.location.href = "./index.html";
    });
  });
})();
</script>
</body>
</html>
