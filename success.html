<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 완료 확인 - 재회운 정밀 사주 풀이</title>
<style>
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #f3f1f5; margin: 0; padding: 32px 16px; color: #222; }
  .box { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
  h1 { margin: 0 0 10px; font-size: 20px; color: #2b1e38; }
  p { margin: 0 0 18px; font-size: 14px; line-height: 1.65; color: #555; }
  .btn { display: inline-block; padding: 13px 22px; background: #5b2c83; color: #fff; text-decoration: none; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; font-size: 15px; }
  .err { color: #c92a42; }
</style>
</head>
<body>
<div class="box">
  <h1 id="statusTitle">결제 내역을 확인하는 중입니다...</h1>
  <p id="statusDesc">잠시만 기다려 주세요. 확인이 끝나면 상세 풀이 화면으로 이동합니다.</p>
  <button type="button" class="btn" id="goBackBtn" style="display:none;">상세 풀이 화면으로 이동</button>
</div>
<script>
(function () {
  const EXPECTED_AMOUNT = 19900;
  const params = new URLSearchParams(window.location.search);
  const amount = Number(params.get("amount") || "0");
  const orderId = (params.get("orderId") || "").trim();
  const paymentKey = (params.get("paymentKey") || "").trim();

  const titleEl = document.getElementById("statusTitle");
  const descEl = document.getElementById("statusDesc");
  const btn = document.getElementById("goBackBtn");

  let pendingOrder = null;
  try {
    const raw = sessionStorage.getItem("saju_pending_order");
    if (raw) pendingOrder = JSON.parse(raw);
  } catch (e) {}

  const isValidOrder = Boolean(orderId) && (!pendingOrder || pendingOrder.orderId === orderId);
  const isValidAmount = amount === EXPECTED_AMOUNT && (!pendingOrder || Number(pendingOrder.amount) === amount);

  btn.addEventListener("click", function () {
    window.location.href = "index.html";
  });

  if (!isValidOrder || !isValidAmount) {
    titleEl.innerText = "결제 정보를 다시 확인해 주세요";
    titleEl.classList.add("err");
    descEl.innerText = "결제 주문 정보나 금액이 일치하지 않습니다. 원래 화면으로 돌아가 다시 확인해 주세요.";
    btn.style.display = "inline-block";
    return;
  }

  try {
    sessionStorage.setItem("saju_verified_payment", JSON.stringify({
      ok: true,
      amount: amount,
      orderId: orderId,
      paymentKey: paymentKey || "VERIFIED_FLOW",
      verifiedAt: Date.now()
    }));
    sessionStorage.removeItem("saju_pending_order");
  } catch (e) {}

  titleEl.innerText = "결제가 완료되었습니다";
  descEl.innerText = "상세 사주 풀이와 리포트 다운로드가 준비되었습니다. 잠시 후 풀이 화면으로 이동합니다.";
  btn.style.display = "inline-block";

  setTimeout(function () {
    window.location.href = "index.html";
  }, 1200);
})();
</script>
</body>
</html>
