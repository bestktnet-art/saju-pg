<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>決済完了の確認 - 復縁運・四柱推命 詳細鑑定</title>
<style>
  body { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif; background: #f3f1f5; margin: 0; padding: 32px 16px; color: #222; }
  .box { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
  h1 { margin: 0 0 10px; font-size: 20px; color: #2b1e38; }
  p { margin: 0 0 18px; font-size: 14px; line-height: 1.65; color: #555; }
  .btn { display: inline-block; padding: 13px 22px; background: #5b2c83; color: #fff; text-decoration: none; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; font-size: 15px; }
  .err { color: #c92a42; }
</style>
</head>
<body>
<div class="box">
  <h1 id="statusTitle">決済内容を確認しています...</h1>
  <p id="statusDesc">しばらくお待ちください。確認が完了すると詳細鑑定画面へ移動します。</p>
  <button type="button" class="btn" id="goBackBtn" style="display:none;">詳細鑑定画面へ進む</button>
</div>
<script>
(function () {
  const EXPECTED_AMOUNT = 2000;
  const params = new URLSearchParams(window.location.search);
  const amount = Number(params.get("amount") || "0");
  const orderId = (params.get("orderId") || "").trim();
  const paymentKey = (params.get("paymentKey") || "").trim();

  const titleEl = document.getElementById("statusTitle");
  const descEl = document.getElementById("statusDesc");
  const btn = document.getElementById("goBackBtn");

  let pendingOrder = null;
  try {
    const raw = sessionStorage.getItem("saju_ja_pending_order");
    if (raw) pendingOrder = JSON.parse(raw);
  } catch (e) {}

  const isValidOrder = Boolean(orderId) && (!pendingOrder || pendingOrder.orderId === orderId);
  const isValidAmount = amount === EXPECTED_AMOUNT && (!pendingOrder || Number(pendingOrder.amount) === amount);

  btn.addEventListener("click", function () {
    window.location.href = "index.html";
  });

  if (!isValidOrder || !isValidAmount) {
    titleEl.innerText = "決済情報をご確認ください";
    titleEl.classList.add("err");
    descEl.innerText = "ご注文情報または決済金額（2,000円）が一致しません。元の画面へ戻って再度ご確認ください。";
    btn.style.display = "inline-block";
    return;
  }

  try {
    sessionStorage.setItem("saju_ja_verified_payment", JSON.stringify({
      ok: true,
      amount: amount,
      orderId: orderId,
      paymentKey: paymentKey || "VERIFIED_FLOW",
      verifiedAt: Date.now()
    }));
    sessionStorage.removeItem("saju_ja_pending_order");
  } catch (e) {}

  titleEl.innerText = "決済が完了しました";
  descEl.innerText = "詳細鑑定とレポート保存の準備が整いました。まもなく鑑定画面へ移動します。";
  btn.style.display = "inline-block";

  setTimeout(function () {
    window.location.href = "index.html";
  }, 1200);
})();
</script>
</body>
</html>
