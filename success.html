<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 완료 확인 - 재회운 정밀 사주 풀이</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; background: #f3f1f5; margin: 0; padding: 32px 16px; color: #222; }
  .box { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
  h1 { margin: 0 0 10px; font-size: 20px; color: #2b1e38; }
  p { margin: 0 0 18px; font-size: 14px; line-height: 1.6; color: #555; }
  .btn { display: inline-block; padding: 13px 22px; background: #5b2c83; color: #fff; text-decoration: none; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; font-size: 15px; }
</style>
</head>
<body>
<div class="box">
  <h1 id="statusTitle">결제 내역을 확인하는 중입니다...</h1>
  <p id="statusDesc">잠시만 기다려 주세요. 확인이 끝나면 상세 풀이 화면으로 이동합니다.</p>
  <button type="button" class="btn" id="goBackBtn" style="display:none;">상세 풀이 화면으로 이동</button>
</div>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const amount = Number(params.get("amount") || 19900);
  const orderId = params.get("orderId") || "";
  const paymentKey = params.get("paymentKey") || "TEST_KEY";

  try {
    sessionStorage.setItem("saju_verified_payment", JSON.stringify({
      ok: true,
      amount: amount,
      orderId: orderId,
      paymentKey: paymentKey
    }));
  } catch (e) {}

  document.getElementById("statusTitle").innerText = "결제 완료가 확인되었습니다";
  document.getElementById("statusDesc").innerText = "상세 풀이 잠금이 해제되었습니다. 버튼이나 자동 이동으로 풀이 화면과 다운로드 버튼을 확인하세요.";

  const backUrl = "사주PG_11-26일.html";
  const btn = document.getElementById("goBackBtn");
  btn.style.display = "inline-block";
  btn.addEventListener("click", function () {
    window.location.href = backUrl;
  });

  setTimeout(function () {
    window.location.href = backUrl;
  }, 1200);
})();
</script>
</body>
</html>
